<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas Copart - Examen WebDev 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6">

  <!-- Header / Autenticación -->
  <header class="flex flex-wrap justify-between items-center bg-white p-4 shadow-sm rounded-lg mb-6 border gap-3">
    <h1 class="text-xl font-bold text-blue-800">🚗 Subastas Copart (Tiempo Real)</h1>
    <div id="user-info" class="flex items-center gap-2">
      <!-- Se renderiza por JS -->
    </div>
  </header>

  <!-- MODAL 1: LOGIN -->
  <div id="login-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full border">
      <h2 class="text-lg font-bold mb-3 text-slate-800">Iniciar Sesión</h2>
      
      <div class="mb-3">
        <label class="block text-xs font-bold text-gray-700 mb-1">Seleccionar Usuario de Prueba:</label>
        <select id="login-email" class="w-full border p-2 rounded text-sm bg-slate-50">
          <!-- Opciones dinámicas cargadas desde localStorage -->
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña:</label>
        <input type="password" value="Password123!" class="w-full border p-2 rounded text-sm bg-slate-50" readonly>
      </div>

      <div class="flex gap-2 mb-3">
        <button onclick="ejecutarLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded text-sm font-bold">Ingresar</button>
        <button onclick="cerrarModal('login-modal')" class="w-full bg-gray-200 text-gray-700 p-2 rounded text-sm font-bold">Cancelar</button>
      </div>
      <p class="text-xs text-center text-gray-500">¿No tienes cuenta? <button onclick="cerrarModal('login-modal'); abrirModal('registro-modal');" class="text-blue-600 underline font-bold">Regístrate aquí</button></p>
    </div>
  </div>

  <!-- MODAL 2: REGISTRO DE NUEVO COMPRADOR -->
  <div id="registro-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full border max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-bold mb-3 text-slate-800">Registro de Nuevo Comprador/Usuario</h2>
      <form onsubmit="registrarUsuario(event)">
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Nombre:</label>
            <input id="reg-nombre" type="text" required class="w-full border p-2 rounded text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Apellido:</label>
            <input id="reg-apellido" type="text" required class="w-full border p-2 rounded text-sm">
          </div>
        </div>
        <div class="mb-3">
          <label class="block text-xs font-bold text-gray-700 mb-1">Correo Electrónico:</label>
          <input id="reg-email" type="email" required placeholder="correo@ejemplo.com" class="w-full border p-2 rounded text-sm">
        </div>
        <div class="mb-3">
          <label class="block text-xs font-bold text-gray-700 mb-1">Teléfono:</label>
          <input id="reg-telefono" type="tel" required placeholder="+502 1234-5678" class="w-full border p-2 rounded text-sm">
        </div>
        <div class="mb-4">
          <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña Segura:</label>
          <input id="reg-password" type="password" required class="w-full border p-2 rounded text-sm">
        </div>
        <div class="flex gap-2">
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded text-sm font-bold">Crear Cuenta</button>
          <button type="button" onclick="cerrarModal('registro-modal')" class="w-full bg-gray-200 text-gray-700 p-2 rounded text-sm font-bold">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL 3: PUBLICAR NUEVO VEHÍCULO -->
  <div id="publicar-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-lg w-full border max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-bold mb-3 text-slate-800">Publicar Vehículo para Subasta</h2>
      <form onsubmit="publicarVehiculo(event)">
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Marca:</label>
            <input id="pub-marca" type="text" required placeholder="Ej. Nissan" class="border p-2 rounded text-sm w-full">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Modelo:</label>
            <input id="pub-modelo" type="text" required placeholder="Ej. Frontier" class="border p-2 rounded text-sm w-full">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Año:</label>
            <input id="pub-anio" type="number" required value="2021" class="border p-2 rounded text-sm w-full">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Motor:</label>
            <input id="pub-motor" type="text" required placeholder="Ej. 2.5L" class="border p-2 rounded text-sm w-full">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Cilindros:</label>
            <input id="pub-cilindros" type="number" required value="4" class="border p-2 rounded text-sm w-full">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Transmisión:</label>
            <select id="pub-transmision" class="border p-2 rounded text-sm w-full">
              <option value="Automática">Automática</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Combustible:</label>
            <select id="pub-combustible" class="border p-2 rounded text-sm w-full">
              <option value="Gasolina">Gasolina</option>
              <option value="Diésel">Diésel</option>
              <option value="Híbrido">Híbrido</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Tren Manejo:</label>
            <select id="pub-tren" class="border p-2 rounded text-sm w-full">
              <option value="4WD">4WD</option>
              <option value="AWD">AWD</option>
              <option value="FWD">FWD</option>
              <option value="RWD">RWD</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Estado de Daño:</label>
            <select id="pub-dano" class="border p-2 rounded text-sm w-full">
              <option value="🟢 Verde">🟢 Verde (Daño Menor / Limpio)</option>
              <option value="🟡 Amarillo">🟡 Amarillo (Daño Medio / Reparable)</option>
              <option value="🔴 Rojo">🔴 Rojo (Daño Severo / Salvamento)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Precio Base (Q.):</label>
            <input id="pub-monto" type="number" min="1000" required value="20000" class="border p-2 rounded text-sm w-full">
          </div>
        </div>

        <!-- 5 FOTOS -->
        <div class="mb-3">
          <label class="block text-xs font-bold text-gray-700 mb-1">Galería (5 Fotografías - URLs):</label>
          <input id="pub-img1" type="url" required value="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=500" class="border p-1.5 rounded text-xs w-full mb-1">
          <input id="pub-img2" type="url" required value="https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500" class="border p-1.5 rounded text-xs w-full mb-1">
          <input id="pub-img3" type="url" required value="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500" class="border p-1.5 rounded text-xs w-full mb-1">
          <input id="pub-img4" type="url" required value="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500" class="border p-1.5 rounded text-xs w-full mb-1">
          <input id="pub-img5" type="url" required value="https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=500" class="border p-1.5 rounded text-xs w-full">
        </div>

        <div class="flex gap-2 mt-4">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded text-sm font-bold">Publicar Vehículo</button>
          <button type="button" onclick="cerrarModal('publicar-modal')" class="w-full bg-gray-200 text-gray-700 p-2 rounded text-sm font-bold">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panel de Filtros -->
  <section class="bg-white p-4 rounded-lg shadow-sm border mb-6">
    <h2 class="font-bold text-gray-700 mb-3 text-sm">Filtros Multitarea de Vehículos</h2>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <input id="filter-text" type="text" placeholder="Buscar por marca o modelo..." class="border p-2 rounded-md text-sm">
      <select id="filter-combust" class="border p-2 rounded-md text-sm">
        <option value="">Combustible (Todos)</option>
        <option value="Gasolina">Gasolina</option>
        <option value="Diésel">Diésel</option>
        <option value="Híbrido">Híbrido</option>
      </select>
      <select id="filter-dano" class="border p-2 rounded-md text-sm">
        <option value="">Nivel de Daño (Todos)</option>
        <option value="🟢 Verde">🟢 Verde (Menor)</option>
        <option value="🟡 Amarillo">🟡 Amarillo (Medio)</option>
        <option value="🔴 Rojo">🔴 Rojo (Severo)</option>
      </select>
      <button onclick="filtrarVehiculos()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-md text-sm font-semibold">Aplicar Filtros</button>
    </div>
  </section>

  <!-- Contenedor Principal de Catálogo -->
  <main id="catalogo-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Se genera dinámicamente -->
  </main>

  <script>
    // DATOS INICIALES POR DEFECTO
    const defaultUsuarios = [
      { email: "comprador1@copart.com", nombre: "Juan Pérez" },
      { email: "comprador2@copart.com", nombre: "María López" },
      { email: "vendedor1@copart.com", nombre: "Carlos Gómez" }
    ];

    const defaultVehiculos = [
      {
        id: 1,
        marca: "Toyota",
        modelo: "Tacoma SR5",
        anio: 2022,
        motor: "3.5L V6",
        transmision: "Automática",
        combustible: "Gasolina",
        tren: "4WD",
        cilindros: 6,
        dano: "🟢 Verde",
        danoTexto: "Daño Menor / Limpio",
        montoBase: 20000,
        ofertaActual: 22000,
        ganadorActual: "comprador1@copart.com",
        publicador: "vendedor1@copart.com",
        tiempoRestanteSec: 600,
        fotoIndex: 0,
        imagenes: [
          "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=500",
          "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500",
          "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500",
          "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500",
          "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=500"
        ]
      },
      {
        id: 2,
        marca: "Ford",
        modelo: "Mustang GT",
        anio: 2020,
        motor: "5.0L V8",
        transmision: "Manual",
        combustible: "Gasolina",
        tren: "RWD",
        cilindros: 8,
        dano: "🟡 Amarillo",
        danoTexto: "Daño Medio / Reparable",
        montoBase: 35000,
        ofertaActual: 40000,
        ganadorActual: "comprador2@copart.com",
        publicador: "vendedor1@copart.com",
        tiempoRestanteSec: 900,
        fotoIndex: 0,
        imagenes: [
          "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=500",
          "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=500",
          "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500",
          "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500",
          "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=500"
        ]
      }
    ];

    // CARGAR DESDE LOCALSTORAGE O USAR DEFECTO
    let usuariosRegistrados = JSON.parse(localStorage.getItem('copart_usuarios')) || defaultUsuarios;
    let vehiculos = JSON.parse(localStorage.getItem('copart_vehiculos')) || defaultVehiculos;
    let usuarioActual = JSON.parse(localStorage.getItem('copart_sesion')) || { logueado: false, email: "" };

    function guardarDatos() {
      localStorage.setItem('copart_usuarios', JSON.stringify(usuariosRegistrados));
      localStorage.setItem('copart_vehiculos', JSON.stringify(vehiculos));
      localStorage.setItem('copart_sesion', JSON.stringify(usuarioActual));
    }

    // MODALES
    function abrirModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }

    function actualizarSelectUsuarios() {
      const sel = document.getElementById('login-email');
      sel.innerHTML = "";
      usuariosRegistrados.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.email;
        opt.innerText = `${u.email} (${u.nombre})`;
        sel.appendChild(opt);
      });
    }

    function renderAuth() {
      actualizarSelectUsuarios();
      const container = document.getElementById('user-info');
      if (usuarioActual.logueado) {
        container.innerHTML = `
          <span class="text-xs text-gray-600 hidden sm:inline">Usuario: <strong class="text-blue-600">${usuarioActual.email}</strong></span>
          <button onclick="abrirModal('publicar-modal')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 text-xs rounded-md font-semibold">➕ Publicar Vehículo</button>
          <button onclick="cerrarSesion()" class="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 px-3 py-1.5 text-xs rounded-md font-semibold">Cerrar Sesión</button>
        `;
      } else {
        container.innerHTML = `
          <button onclick="abrirModal('registro-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 text-xs rounded-md font-semibold">Regístrate</button>
          <button onclick="abrirModal('login-modal')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 text-xs rounded-md font-semibold">Iniciar Sesión</button>
        `;
      }
    }

    function ejecutarLogin() {
      const selEmail = document.getElementById('login-email').value;
      usuarioActual = { logueado: true, email: selEmail };
      guardarDatos();
      cerrarModal('login-modal');
      renderAuth();
      renderCatalogo();
    }

    function registrarUsuario(e) {
      e.preventDefault();
      const nombre = document.getElementById('reg-nombre').value;
      const email = document.getElementById('reg-email').value;

      usuariosRegistrados.push({ email, nombre });
      usuarioActual = { logueado: true, email: email };
      
      guardarDatos();

      alert(`¡Cuenta creada con éxito! Ha iniciado sesión como ${email}`);
      cerrarModal('registro-modal');
      renderAuth();
      renderCatalogo();
    }

    function cerrarSesion() {
      usuarioActual = { logueado: false, email: "" };
      guardarDatos();
      renderAuth();
      renderCatalogo();
    }

    // PUBLICAR VEHÍCULO PERSISTENTE
    function publicarVehiculo(e) {
      e.preventDefault();
      const marca = document.getElementById('pub-marca').value;
      const modelo = document.getElementById('pub-modelo').value;
      const anio = parseInt(document.getElementById('pub-anio').value);
      const motor = document.getElementById('pub-motor').value;
      const cilindros = parseInt(document.getElementById('pub-cilindros').value);
      const transmision = document.getElementById('pub-transmision').value;
      const combustible = document.getElementById('pub-combustible').value;
      const tren = document.getElementById('pub-tren').value;
      const danoVal = document.getElementById('pub-dano').value;
      const montoBase = parseFloat(document.getElementById('pub-monto').value);

      const img1 = document.getElementById('pub-img1').value;
      const img2 = document.getElementById('pub-img2').value;
      const img3 = document.getElementById('pub-img3').value;
      const img4 = document.getElementById('pub-img4').value;
      const img5 = document.getElementById('pub-img5').value;

      let danoTexto = "Daño Menor / Limpio";
      if (danoVal.includes("Amarillo")) danoTexto = "Daño Medio / Reparable";
      if (danoVal.includes("Rojo")) danoTexto = "Daño Severo / Salvamento";

      const nuevoVehiculo = {
        id: Date.now(),
        marca, modelo, anio, motor, transmision, combustible, tren, cilindros,
        dano: danoVal,
        danoTexto,
        montoBase,
        ofertaActual: montoBase,
        ganadorActual: "",
        publicador: usuarioActual.email,
        tiempoRestanteSec: 1200,
        fotoIndex: 0,
        imagenes: [img1, img2, img3, img4, img5]
      };

      vehiculos.unshift(nuevoVehiculo);
      guardarDatos();

      alert("¡Vehículo publicado y guardado exitosamente!");
      cerrarModal('publicar-modal');
      renderCatalogo();
    }

    function cambiarFoto(id, direccion) {
      const v = vehiculos.find(x => x.id === id);
      if (v) {
        v.fotoIndex += direccion;
        if (v.fotoIndex < 0) v.fotoIndex = v.imagenes.length - 1;
        if (v.fotoIndex >= v.imagenes.length) v.fotoIndex = 0;
        
        document.getElementById(`car-img-${id}`).src = v.imagenes[v.fotoIndex];
        document.getElementById(`car-num-${id}`).innerText = `${v.fotoIndex + 1}/${v.imagenes.length}`;
      }
    }

    function seleccionarFotoDirecta(id, idx) {
      const v = vehiculos.find(x => x.id === id);
      if (v) {
        v.fotoIndex = idx;
        document.getElementById(`car-img-${id}`).src = v.imagenes[v.fotoIndex];
        document.getElementById(`car-num-${id}`).innerText = `${v.fotoIndex + 1}/${v.imagenes.length}`;
      }
    }

    function eliminarVehiculo(id) {
      if (confirm("¿Desea eliminar este vehículo del catálogo permanente?")) {
        vehiculos = vehiculos.filter(v => v.id !== id);
        guardarDatos();
        alert("El vehículo ha sido eliminado.");
        renderCatalogo();
      }
    }

    // CATÁLOGO
    function renderCatalogo(lista = vehiculos) {
      const container = document.getElementById('catalogo-container');
      container.innerHTML = "";

      lista.forEach(item => {
        if (item.fotoIndex === undefined) item.fotoIndex = 0;

        const minValida = item.ofertaActual === item.montoBase && item.ganadorActual === "" 
          ? item.montoBase 
          : Math.ceil(item.ofertaActual * 1.10);

        let badgeHtml = "";
        if (usuarioActual.logueado) {
          if (item.ganadorActual === usuarioActual.email) {
            badgeHtml = `<div class="bg-green-100 border border-green-400 text-green-800 px-3 py-2 rounded-md my-3 text-xs font-bold flex items-center gap-1">
              <span>✅</span> ¡Vas ganando esta subasta!
            </div>`;
          } else if (item.ganadorActual !== "") {
            badgeHtml = `<div class="bg-red-100 border border-red-400 text-red-800 px-3 py-2 rounded-md my-3 text-xs font-bold flex items-center gap-1">
              <span>⚠️</span> Tu oferta ha sido superada. ¡Haz tu oferta ahora!
            </div>`;
          }
        }

        let formOferta = "";
        if (item.tiempoRestanteSec <= 0) {
          if (item.ganadorActual !== "") {
            formOferta = `<div class="bg-green-600 text-white p-3 text-center rounded-md font-bold text-sm shadow mb-2">🎉 VEHÍCULO VENDIDO (Q. ${item.ofertaActual.toLocaleString()})</div>`;
          } else {
            formOferta = `<div class="bg-gray-200 text-gray-700 p-2 text-center rounded font-bold text-sm">SUBASTA DESIERTA / NO VENDIDA</div>`;
          }
        } else if (usuarioActual.logueado) {
          formOferta = `
            <div class="flex gap-2">
              <input id="input-oferta-${item.id}" type="number" min="${minValida}" placeholder="Min Q. ${minValida.toLocaleString()}" class="border p-2 rounded-md w-full text-sm">
              <button onclick="realizarOferta(${item.id})" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-bold text-sm">Ofertar</button>
            </div>
          `;
        } else {
          formOferta = `<p class="text-xs text-center text-amber-700 bg-amber-50 p-2 rounded border border-amber-200">Debe <button onclick="abrirModal('login-modal')" class="underline font-bold text-blue-700">Iniciar Sesión</button> para ofertar.</p>`;
        }

        let btnEliminar = "";
        if (usuarioActual.logueado) {
          btnEliminar = `<button onclick="eliminarVehiculo(${item.id})" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 border border-red-300 px-2 py-1 rounded font-bold">🗑️ Eliminar</button>`;
        }

        const fotosThumbnails = item.imagenes.map((imgUrl, idx) => 
          `<img src="${imgUrl}" onclick="seleccionarFotoDirecta(${item.id}, ${idx})" class="w-10 h-8 object-cover rounded cursor-pointer border hover:opacity-80">`
        ).join('');

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-lg shadow-sm border";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-bold border ${item.dano.includes('Verde') ? 'bg-green-100 text-green-800 border-green-300' : item.dano.includes('Amarillo') ? 'bg-yellow-100 text-yellow-800 border-yellow-300' : 'bg-red-100 text-red-800 border-red-300'}">
              ${item.dano} - ${item.danoTexto}
            </span>
            <div class="flex items-center gap-2">
              ${btnEliminar}
              <span class="text-xs text-red-600 font-bold">⏱️ <span id="timer-${item.id}">${formatTime(item.tiempoRestanteSec)}</span></span>
            </div>
          </div>

          <h3 class="text-lg font-bold text-gray-900">${item.marca} ${item.modelo} ${item.anio}</h3>
          <p class="text-xs text-gray-500 mb-3">Motor: ${item.motor} | Transmisión: ${item.transmision} | Combustible: ${item.combustible} | Tren: ${item.tren} (${item.cilindros} Cil.)</p>

          <!-- CARRUSEL -->
          <div class="relative w-full h-48 bg-slate-900 rounded-md mb-2 overflow-hidden">
            <img id="car-img-${item.id}" src="${item.imagenes[item.fotoIndex]}" alt="${item.modelo}" class="w-full h-full object-cover">
            <button onclick="cambiarFoto(${item.id}, -1)" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-1.5 rounded-full text-xs font-bold">◀</button>
            <button onclick="cambiarFoto(${item.id}, 1)" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black text-white p-1.5 rounded-full text-xs font-bold">▶</button>
            <span id="car-num-${item.id}" class="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
              ${item.fotoIndex + 1}/${item.imagenes.length}
            </span>
          </div>

          <div class="flex gap-1 mb-3 overflow-x-auto pb-1">
            ${fotosThumbnails}
          </div>

          <div class="bg-slate-100 p-3 rounded-md mb-2">
            <p class="text-xs text-gray-500">Precio Base: <strong>Q. ${item.montoBase.toLocaleString()}</strong></p>
            <p class="text-base font-bold text-blue-700">Oferta Actual: Q. <span id="oferta-${item.id}">${item.ofertaActual.toLocaleString()}</span></p>
          </div>

          ${badgeHtml}
          ${formOferta}
        `;
        container.appendChild(card);
      });
    }

    // OFERTAR
    function realizarOferta(id) {
      const v = vehiculos.find(x => x.id === id);
      const input = document.getElementById(`input-oferta-${id}`);
      const monto = parseFloat(input.value);

      const minValido = v.ofertaActual === v.montoBase && v.ganadorActual === ""
        ? v.montoBase
        : v.ofertaActual * 1.10;

      if (isNaN(monto)) return alert("Por favor ingrese un monto válido.");
      if (monto < v.montoBase) return alert(`La oferta no puede ser menor al precio base (Q. ${v.montoBase.toLocaleString()}).`);
      if (monto < minValido) return alert(`Regla +10%: La oferta debe ser al menos de Q. ${Math.ceil(minValido).toLocaleString()}`);

      v.ofertaActual = monto;
      v.ganadorActual = usuarioActual.email;
      guardarDatos();

      alert("¡Oferta registrada con éxito!");
      renderCatalogo();
    }

    // FILTROS
    function filtrarVehiculos() {
      const txt = document.getElementById('filter-text').value.toLowerCase();
      const comb = document.getElementById('filter-combust').value;
      const dano = document.getElementById('filter-dano').value;

      const filtrados = vehiculos.filter(v => {
        const matchTxt = v.marca.toLowerCase().includes(txt) || v.modelo.toLowerCase().includes(txt);
        const matchComb = comb === "" || v.combustible === comb;
        const matchDano = dano === "" || v.dano === dano;
        return matchTxt && matchComb && matchDano;
      });

      renderCatalogo(filtrados);
    }

    // TEMPORIZADOR
    function formatTime(sec) {
      if (sec <= 0) return "CERRADO";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    setInterval(() => {
      let cambio = false;
      vehiculos.forEach(v => {
        if (v.tiempoRestanteSec > 0) {
          v.tiempoRestanteSec--;
          const el = document.getElementById(`timer-${v.id}`);
          if (el) el.innerText = formatTime(v.tiempoRestanteSec);
          if (v.tiempoRestanteSec === 0) cambio = true;
        }
      });
      if (cambio) {
        guardarDatos();
        renderCatalogo();
      }
    }, 1000);

    // Inicialización
    renderAuth();
    renderCatalogo();
  </script>
</body>
</html>
