<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas Copart - Examen WebDev 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-6">

  <!-- Header / Autenticación -->
  <header class="flex flex-wrap justify-between items-center bg-white p-4 shadow-sm rounded-lg mb-6 border gap-3">
    <h1 class="text-xl font-bold text-blue-800">🚗 Subastas Copart (Tiempo Real)</h1>
    <div id="user-info" class="flex items-center gap-3">
      <!-- Se actualiza por JavaScript -->
    </div>
  </header>

  <!-- Panel de Filtros -->
  <section class="bg-white p-4 rounded-lg shadow-sm border mb-6">
    <h2 class="font-bold text-gray-700 mb-3 text-sm">Filtros Multitarea</h2>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <input id="filter-text" type="text" placeholder="Buscar por marca o modelo..." class="border p-2 rounded-md text-sm">
      <select id="filter-combust" class="border p-2 rounded-md text-sm">
        <option value="">Combustible (Todos)</option>
        <option value="Gasolina">Gasolina</option>
        <option value="Diésel">Diésel</option>
        <option value="Híbrido">Híbrido</option>
      </select>
      <select id="filter-dano" class="border p-2 rounded-md text-sm">
        <option value="">Nivel de Daño (Todos)</option>
        <option value="🟢 Verde">🟢 Verde (Menor)</option>
        <option value="🟡 Amarillo">🟡 Amarillo (Medio)</option>
        <option value="🔴 Rojo">🔴 Rojo (Severo)</option>
      </select>
      <button onclick="filtrarVehiculos()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-md text-sm font-semibold">Aplicar Filtros</button>
    </div>
  </section>

  <!-- Contenedor Principal de Catálogo -->
  <main id="catalogo-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Se genera dinámicamente con JS -->
  </main>

  <script>
    // 1. ESTADO GLOBAL DE LA APLICACIÓN
    let usuarioActual = { logueado: true, email: "comprador1@copart.com", nombre: "Juan Pérez" };

    let vehiculos = [
      {
        id: 1,
        marca: "Toyota",
        modelo: "Tacoma SR5",
        anio: 2022,
        motor: "3.5L V6",
        transmision: "Automática",
        combustible: "Gasolina",
        tren: "4WD",
        cilindros: 6,
        dano: "🟢 Verde",
        danoTexto: "Daño Menor / Limpio",
        montoBase: 20000,
        ofertaActual: 22000,
        ganadorActual: "comprador1@copart.com", // El usuario logueado va ganando
        tiempoRestanteSec: 320,
        imagenes: [
          "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=500",
          "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=500"
        ]
      },
      {
        id: 2,
        marca: "Ford",
        modelo: "Mustang GT",
        anio: 2020,
        motor: "5.0L V8",
        transmision: "Manual",
        combustible: "Gasolina",
        tren: "RWD",
        cilindros: 8,
        dano: "🟡 Amarillo",
        danoTexto: "Daño Medio / Reparable",
        montoBase: 35000,
        ofertaActual: 40000,
        ganadorActual: "comprador2@copart.com", // Oferta superada por otro
        tiempoRestanteSec: 180,
        imagenes: [
          "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=500"
        ]
      }
    ];

    // 2. RENDERIZAR AUTENTICACIÓN
    function renderAuth() {
      const container = document.getElementById('user-info');
      if (usuarioActual.logueado) {
        container.innerHTML = `
          <span class="text-xs md:text-sm text-gray-600">Sesión: <strong class="text-blue-600">${usuarioActual.email}</strong></span>
          <button onclick="toggleAuth()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-1.5 text-xs rounded-md font-semibold">Cerrar Sesión</button>
        `;
      } else {
        container.innerHTML = `
          <span class="text-xs text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-200">Modo Lectura (Visitante Anónimo)</span>
          <button onclick="toggleAuth()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 text-xs rounded-md font-semibold">Iniciar Sesión</button>
        `;
      }
    }

    function toggleAuth() {
      usuarioActual.logueado = !usuarioActual.logueado;
      renderAuth();
      renderCatalogo();
    }

    // 3. RENDERIZAR TARJETAS Y REGLAS DE NEGOCIO
    function renderCatalogo(lista = vehiculos) {
      const container = document.getElementById('catalogo-container');
      container.innerHTML = "";

      lista.forEach(item => {
        // Regla: Oferta mínima +10%
        const minValida = Math.ceil(item.ofertaActual * 1.10);

        // Indicador Visual en Tiempo Real (Badge)
        let badgeHtml = "";
        if (usuarioActual.logueado) {
          if (item.ganadorActual === usuarioActual.email) {
            badgeHtml = `<div class="bg-green-100 border border-green-400 text-green-800 px-3 py-2 rounded-md my-3 text-xs font-bold flex items-center gap-1">
              <span>✅</span> ¡Vas ganando esta subasta!
            </div>`;
          } else {
            badgeHtml = `<div class="bg-red-100 border border-red-400 text-red-800 px-3 py-2 rounded-md my-3 text-xs font-bold flex items-center gap-1">
              <span>⚠️</span> Tu oferta ha sido superada. ¡Haz tu oferta ahora!
            </div>`;
          }
        }

        // Formulario o bloqueo si no está autenticado
        let formOferta = "";
        if (item.tiempoRestanteSec <= 0) {
          formOferta = `<div class="bg-gray-200 text-gray-700 p-2 text-center rounded font-bold text-sm">OFERTA CERRADA</div>`;
        } else if (usuarioActual.logueado) {
          formOferta = `
            <div class="flex gap-2">
              <input id="input-oferta-${item.id}" type="number" min="${minValida}" placeholder="Min Q. ${minValida.toLocaleString()}" class="border p-2 rounded-md w-full text-sm">
              <button onclick="realizarOferta(${item.id})" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-bold text-sm">Ofertar</button>
            </div>
          `;
        } else {
          formOferta = `<p class="text-xs text-center text-amber-700 bg-amber-50 p-2 rounded border border-amber-200">Debe <strong>Iniciar Sesión</strong> para poder ofertar en este vehículo.</p>`;
        }

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-lg shadow-sm border";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-bold border ${item.dano.includes('Verde') ? 'bg-green-100 text-green-800 border-green-300' : 'bg-yellow-100 text-yellow-800 border-yellow-300'}">
              ${item.dano} - ${item.danoTexto}
            </span>
            <span class="text-xs text-red-600 font-bold">⏱️ Tiempo: <span id="timer-${item.id}">${formatTime(item.tiempoRestanteSec)}</span></span>
          </div>

          <h3 class="text-lg font-bold text-gray-900">${item.marca} ${item.modelo} ${item.anio}</h3>
          <p class="text-xs text-gray-500 mb-3">Motor: ${item.motor} | Transmisión: ${item.transmision} | Combustible: ${item.combustible} | ${item.tren} (${item.cilindros} Cil.)</p>

          <img src="${item.imagenes[0]}" alt="${item.modelo}" class="w-full h-44 object-cover rounded-md mb-3">

          <div class="bg-slate-100 p-3 rounded-md mb-2">
            <p class="text-xs text-gray-500">Precio Base: <strong>Q. ${item.montoBase.toLocaleString()}</strong></p>
            <p class="text-base font-bold text-blue-700">Oferta Actual: Q. <span id="oferta-${item.id}">${item.ofertaActual.toLocaleString()}</span></p>
          </div>

          ${badgeHtml}
          ${formOferta}
        `;
        container.appendChild(card);
      });
    }

    // 4. LÓGICA DE PUJA Y VALIDACIONES
    function realizarOferta(id) {
      const v = vehiculos.find(x => x.id === id);
      const input = document.getElementById(`input-oferta-${id}`);
      const monto = parseFloat(input.value);
      const minValido = v.ofertaActual * 1.10;

      if (isNaN(monto)) {
        alert("Por favor ingrese un monto válido.");
        return;
      }
      if (monto < v.montoBase) {
        alert(`La oferta no puede ser menor al precio base (Q. ${v.montoBase.toLocaleString()}).`);
        return;
      }
      if (monto < minValido) {
        alert(`Regla +10%: Toda nueva oferta debe superar la actual por al menos 10%. Monto mínimo: Q. ${Math.ceil(minValido).toLocaleString()}`);
        return;
      }

      // Actualización en tiempo real de la subasta
      v.ofertaActual = monto;
      v.ganadorActual = usuarioActual.email;
      alert("¡Oferta registrada con éxito!");
      renderCatalogo();
    }

    // 5. FILTROS MULTITAREA
    function filtrarVehiculos() {
      const txt = document.getElementById('filter-text').value.toLowerCase();
      const comb = document.getElementById('filter-combust').value;
      const dano = document.getElementById('filter-dano').value;

      const filtrados = vehiculos.filter(v => {
        const matchTxt = v.marca.toLowerCase().includes(txt) || v.modelo.toLowerCase().includes(txt);
        const matchComb = comb === "" || v.combustible === comb;
        const matchDano = dano === "" || v.dano === dano;
        return matchTxt && matchComb && matchDano;
      });

      renderCatalogo(filtrados);
    }

    // 6. RELOJ EN TIEMPO REAL
    function formatTime(sec) {
      if (sec <= 0) return "CERRADO";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    setInterval(() => {
      vehiculos.forEach(v => {
        if (v.tiempoRestanteSec > 0) {
          v.tiempoRestanteSec--;
          const el = document.getElementById(`timer-${v.id}`);
          if (el) el.innerText = formatTime(v.tiempoRestanteSec);
        }
      });
    }, 1000);

    // Inicialización al cargar la página
    renderAuth();
    renderCatalogo();
  </script>
</body>
</html>
